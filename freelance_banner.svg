<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090d" />
      <stop offset="50%" stop-color="#0e1017" />
      <stop offset="100%" stop-color="#141722" />
    </linearGradient>

    <!-- Teal/Purple Glows -->
    <radialGradient id="glow-purple" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6b4fe0" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6b4fe0" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-teal" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d1c4ff" />
    </linearGradient>
    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#23273a" stroke-width="0.7" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background and Ambient Glows -->
  <rect width="1200" height="350" fill="url(#bg-grad)" rx="12" />
  <rect width="1200" height="350" fill="url(#glow-purple)" rx="12" />
  <rect width="1200" height="350" fill="url(#glow-teal)" rx="12" />
  <rect width="1200" height="350" fill="url(#grid)" rx="12" />

  <!-- Technical Accents -->
  <circle cx="100" cy="80" r="3" fill="#6b4fe0" opacity="0.8" />
  <line x1="80" y1="80" x2="120" y2="80" stroke="#6b4fe0" stroke-width="1" opacity="0.4" />
  <line x1="100" y1="60" x2="100" y2="100" stroke="#6b4fe0" stroke-width="1" opacity="0.4" />
  
  <rect x="1080" y="230" width="40" height="40" fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.2" rx="4" />
  <line x1="1060" y1="250" x2="1140" y2="250" stroke="#00f2fe" stroke-width="0.5" opacity="0.3" />

  <!-- Center Content -->
  <g transform="translate(600, 175)">
    <!-- Availability Pill -->
    <rect x="-110" y="-115" width="220" height="32" rx="16" fill="#1b1c26" stroke="#2c2d3f" stroke-width="1" />
    <circle cx="-80" cy="-99" r="5" fill="#3ECF6C">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text text-anchor="middle" x="10" y="-93" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#3ECF6C" letter-spacing="1.5">
      AVAILABLE FOR WORK
    </text>

    <!-- Name -->
    <text text-anchor="middle" y="-25" font-family="system-ui, -apple-system, sans-serif" font-size="60" font-weight="900" fill="url(#title-grad)" letter-spacing="2">
      RUSHIT BODRA
    </text>
    
    <!-- Subtitle (Freelancer Focus) -->
    <text text-anchor="middle" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="url(#accent-grad)" letter-spacing="3">
      FREELANCE AI/ML &amp; DATA ENGINEER
    </text>

    <!-- Separator Line -->
    <line x1="-180" y1="52" x2="180" y2="52" stroke="#2c2d3f" stroke-width="1.5" />

    <!-- Value Statement / Tagline -->
    <text text-anchor="middle" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#8f93a9" letter-spacing="1">
      Building custom AI agents, automated pipelines, and models that solve business problems.
    </text>
  </g>
</svg>
